{% extends "base.html" %}

{% block title %}Send Message - Bot Control Panel{% endblock %}

{% block content %}
<div class="row">
    <div class="col-12">
        <h2 class="mb-4"><i class="bi bi-send"></i> Send Message</h2>
    </div>
</div>

<div class="row">
    <div class="col-md-8 mx-auto">
        <div class="card">
            <div class="card-header bg-primary text-white">
                <h5 class="mb-0"><i class="bi bi-chat-dots"></i> Send WhatsApp Message</h5>
            </div>
            <div class="card-body">
                <form method="POST" action="{{ url_for('send_message') }}">
                    <div class="mb-3">
                        <label for="to" class="form-label">Phone Number</label>
                        <input type="text" class="form-control" id="to" name="to" 
                               placeholder="6281234567890" required>
                        <small class="form-text text-muted">Enter phone number without + or @ (e.g., 6281234567890)</small>
                    </div>
                    
                    <div class="mb-3">
                        <label for="message" class="form-label">Message</label>
                        <textarea class="form-control" id="message" name="message" rows="5" 
                                  placeholder="Enter your message here..." required></textarea>
                    </div>
                    
                    <button type="submit" class="btn btn-primary">
                        <i class="bi bi-send"></i> Send Message
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
